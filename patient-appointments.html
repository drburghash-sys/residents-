<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta name="robots" content="noindex,nofollow"><title>مواعيدك ومتطلباتها</title><link rel="stylesheet" href="./patient-plan.css"></head><body class="patient-page"><main><header><span>خطة تجهيز المريض</span><h1>مواعيدك بالترتيب</h1><p>اتبع الترتيب الموضح، واحجز المواعيد التي لم يُحدد تاريخها.</p></header><p class="plan-note">هذه نسخة وقت إصدار الرمز وليست حجزًا مؤكدًا أو تحديثًا مباشرًا. عند تغيير الخطة اطلب رمزًا جديدًا من الفريق المعالج.</p><p id="issued"></p><div id="steps" aria-live="polite">جارٍ قراءة المواعيد…</div><button onclick="window.print()" class="print-plan">طباعة / حفظ PDF</button></main><script src="./patient-plan.js"></script><script>
(async function(){try{const p=await PatientPlan.decode(location.hash.slice(1));PatientPlan.render(document.getElementById('steps'),p.rows);const d=new Date(p.at);document.getElementById('issued').textContent='تاريخ إصدار الخطة: '+(isNaN(d)?'غير محدد':d.toLocaleString('ar-SA-u-ca-gregory'));}catch(e){document.getElementById('steps').textContent='تعذر قراءة المواعيد. اطلب رابطًا أو رمزًا جديدًا من الفريق المعالج. '+e.message;}})();
</script></body></html>
